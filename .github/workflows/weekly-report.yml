name: Weekly status report
on:
  schedule:
    - cron: "30 10 * * 5"   # every Friday 10:30 UTC = 16:00 India time (GitHub cron is UTC; it may start a few minutes late)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
permissions:
  contents: write            # needed to save the reports and the snapshot back to the repository
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm test
      - run: node status_report.js data/tracker.xlsx --gates data/gates.csv
      - uses: actions/upload-artifact@v4
        with: { name: weekly-reports, path: reports/ }
      - name: Save reports and snapshot to the repository
        run: |
          git config user.name "weekly-report-bot"
          git config user.email "weekly-report-bot@users.noreply.github.com"
          git add reports snapshots
          git diff --staged --quiet || git commit -m "Weekly report $(date -u +%F)"
          git push
